user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting Zones (5 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    upstream web_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name hypehavenhub.in www.hypehavenhub.in;

        # Redirect all HTTP requests to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name hypehavenhub.in www.hypehavenhub.in;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/hypehavenhub.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hypehavenhub.in/privkey.pem;
        
        # SSL Protocols and Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Strict Transport Security (HSTS)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Standard Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Caching static assets
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Caching media uploads
        location /media/ {
            alias /app/media/;
            expires 1m;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # Proxy connection to Gunicorn
        location / {
            proxy_pass http://web_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Apply rate limiting on login/payment verification and checkout
            location ~* /(login|verify-otp|place-order)/ {
                limit_req zone=api_limit burst=10 nodelay;
                proxy_pass http://web_app;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
}
