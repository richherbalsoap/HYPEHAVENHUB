{% extends 'base.html' %}
{% block title %}Forgot Password - Glamour Store{% endblock %}
{% block content %}
<div class="auth-bg">
  <div class="container">
    <div class="glamour-form-card">
      <div class="text-center mb-4">
        <div style="font-size: 40px; color: var(--pink); margin-bottom: 12px;"><i class="fas fa-lock"></i></div>
        <h2 class="glamour-form-title">Forgot Password?</h2>
        <p class="glamour-form-subtitle">Enter your email to receive a reset OTP</p>
      </div>
      <form method="POST">
        {% csrf_token %}
        {% if form.email.errors %}<div class="alert alert-danger p-3 mb-3" style="border-radius: 10px; font-size: 14px;">{{ form.email.errors }}</div>{% endif %}
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <button type="submit" class="btn-pink">Send OTP</button>
      </form>
      <div class="text-center mt-4"><a href="{% url 'login' %}" class="text-pink small text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a></div>
    </div>
  </div>
</div>
{% endblock %}
