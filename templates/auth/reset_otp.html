{% extends 'base.html' %}
{% block title %}Reset OTP - Glamour Store{% endblock %}
{% block content %}
<div class="auth-bg">
  <div class="container">
    <div class="glamour-form-card text-center">
      <div style="font-size: 48px; color: var(--pink); margin-bottom: 16px;"><i class="fas fa-key"></i></div>
      <h2 class="glamour-form-title">Enter Reset OTP</h2>
      <p class="glamour-form-subtitle">OTP sent to <strong>{{ email }}</strong></p>
      <form method="POST" class="text-start">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Enter OTP</label>
          <input type="text" name="otp" class="form-control text-center" style="font-size: 24px; letter-spacing: 12px; font-weight: 700;" placeholder="• • • • • •" maxlength="6" required>
        </div>
        <button type="submit" class="btn-pink">Verify OTP</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
