{% extends 'base.html' %}
{% block title %}Verify Email - HYPEHAVENHUB{% endblock %}
{% block content %}
<div class="auth-bg">
  <div class="container">
    <div class="glamour-form-card text-center">
      <div style="font-size: 48px; color: var(--primary); margin-bottom: 16px;"><span class="material-symbols-outlined" style="font-size: inherit;">mail</span></div>
      <h2 class="glamour-form-title">Verify Your Email</h2>
      <p class="glamour-form-subtitle">We sent a 6-digit OTP to <strong>{{ email }}</strong></p>
      <form method="POST" class="text-start">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Enter OTP</label>
          <input type="text" name="otp" class="form-control text-center otp-code-input" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)" required autocomplete="one-time-code" autofocus>
        </div>
        <button type="submit" class="btn-artisan-primary">Verify & Continue</button>
      </form>
      <div class="mt-3 text-muted small">Didn't receive? Check spam folder. In development, OTP is logged in server console.</div>
    </div>
  </div>
</div>
{% endblock %}
