{% extends 'base.html' %}
{% block title %}Verify Email - Glamour Store{% endblock %}
{% block content %}
<div class="auth-bg">
  <div class="container">
    <div class="glamour-form-card text-center">
      <div style="font-size: 48px; color: var(--pink); margin-bottom: 16px;"><i class="fas fa-envelope-open-text"></i></div>
      <h2 class="glamour-form-title">Verify Your Email</h2>
      <p class="glamour-form-subtitle">We sent a 6-digit OTP to <strong>{{ email }}</strong></p>
      <form method="POST" class="text-start">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Enter OTP</label>
          <input type="text" name="otp" class="form-control text-center" style="font-size: 24px; letter-spacing: 12px; font-weight: 700;" placeholder="• • • • • •" maxlength="6" required autocomplete="off">
        </div>
        <button type="submit" class="btn-pink">Verify & Continue</button>
      </form>
      <div class="mt-3 text-muted small">Didn't receive? Check your console log in development mode.</div>
    </div>
  </div>
</div>
{% endblock %}
