{% extends 'base.html' %}
{% block title %}Reset Password - Glamour Store{% endblock %}
{% block content %}
<div class="auth-bg">
  <div class="container">
    <div class="glamour-form-card">
      <div class="text-center mb-4">
        <div style="font-size: 40px; color: var(--pink); margin-bottom: 12px;"><i class="fas fa-shield-alt"></i></div>
        <h2 class="glamour-form-title">Set New Password</h2>
        <p class="glamour-form-subtitle">Create a strong new password</p>
      </div>
      <form method="POST">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger p-3 mb-3" style="border-radius: 10px; font-size: 14px;">{{ form.errors }}</div>{% endif %}
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" name="new_password1" class="form-control" placeholder="Min. 8 characters" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="new_password2" class="form-control" placeholder="Repeat new password" required>
        </div>
        <button type="submit" class="btn-pink">Reset Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
