{% extends 'admin/custom_base.html' %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h3 text-white mb-0">{{ title }}</h2>
    <a href="{% url 'admin_countries' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back to Countries
    </a>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm border-0 bg-dark text-white">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Country Name</label>
                            <input type="text" name="name" class="form-control bg-secondary text-white border-0" 
                                   value="{{ country.name }}" placeholder="e.g. United Kingdom" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Country Code (2 letters)</label>
                            <input type="text" name="code" class="form-control bg-secondary text-white border-0" 
                                   value="{{ country.code }}" placeholder="e.g. GB" maxlength="2" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Currency Code</label>
                            <input type="text" name="currency_code" class="form-control bg-secondary text-white border-0" 
                                   value="{{ country.currency_code|default:'USD' }}" placeholder="e.g. GBP" maxlength="3" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Currency Symbol</label>
                            <input type="text" name="currency_symbol" class="form-control bg-secondary text-white border-0" 
                                   value="{{ country.currency_symbol|default:'$' }}" placeholder="e.g. £" maxlength="5" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Default Language</label>
                            <input type="text" name="default_language" class="form-control bg-secondary text-white border-0" 
                                   value="{{ country.default_language|default:'en' }}" placeholder="e.g. en" maxlength="5" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Base Shipping Charge</label>
                            <input type="number" step="0.01" name="shipping_charge" class="form-control bg-secondary text-white border-0" 
                                   value="{{ country.shipping_charge|default:'0.00' }}" placeholder="e.g. 15.00" required>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary py-2">
                            <i class="fas fa-save"></i> Save Country Setting
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
