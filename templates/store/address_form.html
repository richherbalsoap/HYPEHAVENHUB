{% extends 'base.html' %}
{% block title %}{{ title }} - HYPEHAVENHUB{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="checkout-step">
        <h4 class="fw-700 mb-4"><i class="fas fa-map-marker-alt text-pink me-2"></i>{{ title }}</h4>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Address Type</label>
            {{ form.type }}
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" name="full_name" class="form-control" value="{{ form.full_name.value|default:'' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control" value="{{ form.phone.value|default:'' }}" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Address Line 1</label>
            <input type="text" name="address_line1" class="form-control" value="{{ form.address_line1.value|default:'' }}" placeholder="House/Flat, Street" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Address Line 2 <span class="text-muted">(optional)</span></label>
            <input type="text" name="address_line2" class="form-control" value="{{ form.address_line2.value|default:'' }}" placeholder="Landmark, Area">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" value="{{ form.city.value|default:'' }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">State</label>
              <input type="text" name="state" class="form-control" value="{{ form.state.value|default:'' }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Pincode</label>
              <input type="text" name="pincode" class="form-control" value="{{ form.pincode.value|default:'' }}" required>
            </div>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="is_default" id="isDefault" {% if form.is_default.value %}checked{% endif %} style="accent-color: var(--pink);">
            <label class="form-check-label" for="isDefault">Set as default address</label>
          </div>
          <div class="d-flex gap-3">
            <button type="submit" class="btn-pink" style="width: auto; padding: 12px 32px;">Save Address</button>
            <a href="{% url 'address_list' %}" class="btn btn-outline-secondary" style="border-radius: 10px; padding: 12px 24px;">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
