{% load localization_tags i18n_store %}
<div class="col-6 col-md-4 col-lg-3 mb-4">
  <div class="range-product-card">
    <div class="range-img-container">
      <a href="{% url 'product_detail' product.slug %}" class="range-product-link">
        {% if product.display_image_url %}
          <img src="{{ product.display_image_url }}" alt="{{ product.name }}" class="range-product-img" loading="lazy">
        {% else %}
          <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111;color:var(--primary);font-size:48px;">
            <span class="material-symbols-outlined">diamond</span>
          </div>
        {% endif %}
      </a>
      {% if badge %}
        <span class="range-card-badge">{{ badge }}</span>
      {% endif %}
      
      {% if user.is_authenticated %}
      <button class="range-wishlist-btn {% if product.id in wishlist_product_ids %}active{% endif %}" data-wishlist data-product-id="{{ product.id }}" title="Wishlist">
        <i class="{% if product.id in wishlist_product_ids %}fas fa-heart{% else %}far fa-heart{% endif %}"></i>
      </button>
      {% endif %}
    </div>
    
    <div class="range-card-info">
      <div class="range-product-meta">{{ product.category.name|upper }}</div>
      <a href="{% url 'product_detail' product.slug %}" class="range-product-title">{{ product.name }}</a>
      <div class="range-product-price">{% get_localized_price product request %}</div>
      
      <button class="range-add-btn" data-add-cart data-product-id="{{ product.id }}" data-variant-id="{{ product.variants.first.id }}">
        ADD TO CART
      </button>
    </div>
  </div>
</div>
