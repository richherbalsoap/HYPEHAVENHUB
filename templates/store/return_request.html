{% extends 'base.html' %}
{% block title %}Return Request - Glamour Store{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="checkout-step">
        <h4 class="fw-700 mb-2"><i class="fas fa-undo text-pink me-2"></i>Return Request</h4>
        <p class="text-muted mb-4">Order <strong class="text-pink">#{{ order.order_id }}</strong></p>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Return Reason</label>
            <select name="reason" class="form-select" required>
              <option value="">Select a reason</option>
              <option value="damaged">Product is Damaged</option>
              <option value="wrong">Wrong Product Delivered</option>
              <option value="not_as_described">Not as Described</option>
              <option value="expired">Expired Product</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label">Description <span class="text-muted">(optional)</span></label>
            <textarea name="description" class="form-control" rows="4" placeholder="Describe the issue..."></textarea>
          </div>
          <div class="d-flex gap-3">
            <button type="submit" class="btn-pink" style="width: auto; padding: 12px 32px;">Submit Return Request</button>
            <a href="{% url 'order_detail' order.order_id %}" class="btn btn-outline-secondary" style="border-radius: 10px; padding: 12px 24px;">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
